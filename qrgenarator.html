<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR Code Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .card {
            border-radius: 16px;
        }

        #qrcode img {
            max-width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg p-4">
                <h3 class="text-center mb-3 fw-bold">QR Code Generator</h3>

                <!-- Text Input -->
                <div class="mb-3">
                    <label class="form-label">Link or Text</label>
                    <input type="text" id="text" class="form-control" placeholder="Enter URL or text">
                </div>

                <!-- Size -->
                <div class="mb-3">
                    <label class="form-label">
                        QR Size: <span id="sizeValue" class="fw-bold">200</span>px
                    </label>
                    <input type="range" id="size" class="form-range" min="150" max="300" value="200">
                </div>

                <!-- Colors -->
                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">QR Color</label>
                        <input type="color" id="qrColor" class="form-control form-control-color" value="#000000">
                    </div>
                    <div class="col">
                        <label class="form-label">Background</label>
                        <input type="color" id="bgColor" class="form-control form-control-color" value="#ffffff">
                    </div>
                </div>

                <!-- QR Output -->
                <div class="text-center my-3" id="qrcode"></div>

                <!-- Download Button -->
                <div class="d-grid">
                    <button id="downloadBtn" class="btn btn-success d-none">
                        ⬇ Download QR
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- QR Code Library -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<script>
    const textInput = document.getElementById("text");
    const sizeInput = document.getElementById("size");
    const sizeValue = document.getElementById("sizeValue");
    const qrColor = document.getElementById("qrColor");
    const bgColor = document.getElementById("bgColor");
    const qrContainer = document.getElementById("qrcode");
    const downloadBtn = document.getElementById("downloadBtn");

    function generateQR() {
        const text = textInput.value.trim();

        if (!text) {
            qrContainer.innerHTML = "";
            downloadBtn.classList.add("d-none");
            return;
        }

        qrContainer.innerHTML = "";

        new QRCode(qrContainer, {
            text: text,
            width: sizeInput.value,
            height: sizeInput.value,
            colorDark: qrColor.value,
            colorLight: bgColor.value
        });

        downloadBtn.classList.remove("d-none");
    }

    // Auto update
    textInput.addEventListener("input", generateQR);
    sizeInput.addEventListener("input", () => {
        sizeValue.textContent = sizeInput.value;
        generateQR();
    });
    qrColor.addEventListener("input", generateQR);
    bgColor.addEventListener("input", generateQR);

    // Download
    downloadBtn.addEventListener("click", () => {
        const img = qrContainer.querySelector("img");
        if (!img) return;

        const a = document.createElement("a");
        a.href = img.src;
        a.download = "qr-code.png";
        a.click();
    });
</script>

</body>
</html>
